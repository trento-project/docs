name: Publish Trento documentation on GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'trento-docs-site/**'
      - 'trento-docs-site-ui/build/ui-bundle.zip'
      - '.github/workflows/build-page.yaml'
      - 'versions.yml'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 4' # Every Thursday at 1:00 PM UTC
concurrency:
  # Pull requests only build, so they get one queue each; every deploying event shares one queue
  group: github-pages-${{ github.event.pull_request.number || 'deploy' }}
  # Never interrupt a deployment, but let a new push to a pull request supersede the previous build
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      node_image: ${{ steps.read-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Node.js image from versions.yml
        id: read-image
        run: echo "image=$(scripts/check-node-version.sh image)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    # SUSE BCI image taken from versions.yml, the same one docker-compose.yml uses
    container:
      image: ${{ needs.prepare.outputs.node_image }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Check the Node.js version against .tool-versions
      run: scripts/check-node-version.sh
    - name: Configure Pages
      if: github.event_name != 'pull_request'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Install dependencies
      working-directory: trento-docs-site
      run: npm ci
    - name: Generate Site
      working-directory: trento-docs-site
      run: npx antora antora-playbook.yml
    - name: Upload Artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: trento-docs-site/build/trento-docs-site-public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
