name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    uses: trento-project/.github/.github/workflows/dependabot-auto-merge.yaml@9eeba3813dd18bf0350ba0c867ef0f3f2cc26342 # v1.13.0
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
