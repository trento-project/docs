name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    uses: trento-project/.github/.github/workflows/dependabot-auto-merge.yaml@4ca871917ddcecb8cca455409a299d2be7bcbe11 # v1.12.0
    secrets:
      gh_token: ${{ secrets.TRENTOBOT_GH_PAT }}
