# Every Node.js service imports the image from versions.yml, so they all run the
# same Node.js and none of them can pin a different one. Each service verifies
# on start that the image matches .tool-versions.
x-node-base: &node-base
  extends:
    file: versions.yml
    service: node

x-http-health: &http-health
  interval: 5s
  timeout: 3s
  retries: 60

services:
  trento-docs-build:
    <<: *node-base
    working_dir: /workspace/trento-docs-site
    volumes:
      - .:/workspace:z
      # Keep the container's Linux install separate from the host's node_modules
      - trento-docs-node-modules:/workspace/trento-docs-site/node_modules
    command: >
      bash -lc "
        /workspace/scripts/check-node-version.sh &&
        npm ci &&
        npx antora antora-playbook.yml
      "
    restart: "no"

  trento-docs:
    <<: *node-base
    working_dir: /workspace/trento-docs-site
    volumes:
      - .:/workspace:z
    command: >
      bash -lc "
        /workspace/scripts/check-node-version.sh &&
        npx --yes http-server build/trento-docs-site-public/ -c-1 -p 3000
      "
    ports:
      - "3000:3000"
    depends_on:
      trento-docs-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000'"]
      <<: *http-health
  suse-daps-build:
    image: registry.opensuse.org/documentation/containers/15.6/opensuse-daps-toolchain:latest
    working_dir: /tmp
    volumes:
      - .:/src
    command: >
      bash -lc "set -euo pipefail;
      cd /src/trento;
      rm -rf build/SLES-SAP-trento;
      daps --color=0 -d DC-SLES-SAP-trento html;
      daps --color=0 -d DC-SLES-SAP-trento pdf;"
    restart: "no"

  daps-html-serve:
    <<: *node-base
    working_dir: /srv
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./trento/build/SLES-SAP-trento/html/SLES-SAP-trento:/srv:ro
      # Only what the version check needs; the repository is not mounted here
      - ./scripts:/workspace/scripts:ro
      - ./versions.yml:/workspace/versions.yml:ro
      - ./.tool-versions:/workspace/.tool-versions:ro
    command: >
      bash -lc "
        /workspace/scripts/check-node-version.sh &&
        npx --yes http-server /srv -c-1 -p 3001
      "
    depends_on:
      suse-daps-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3001'"]
      <<: *http-health

  daps-pdf-serve:
    <<: *node-base
    working_dir: /srv
    ports:
      - "${PORTPDF:-3002}:3002"
    volumes:
      - ./trento/build/SLES-SAP-trento/:/srv:ro
      # Only what the version check needs; the repository is not mounted here
      - ./scripts:/workspace/scripts:ro
      - ./versions.yml:/workspace/versions.yml:ro
      - ./.tool-versions:/workspace/.tool-versions:ro
    command: >
      bash -lc "
        /workspace/scripts/check-node-version.sh &&
        npx --yes http-server /srv -c-1 -p 3002
      "
    depends_on:
      suse-daps-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3002'"]
      <<: *http-health

volumes:
  trento-docs-node-modules:
